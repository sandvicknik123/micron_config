################
# X/Y Steppers #
################


[stepper_y]
step_pin: micro:gpio6
dir_pin: !micro:gpio3
enable_pin: !micro:gpio7
rotation_distance: 32
microsteps: 32
full_steps_per_rotation:200 #400 for 0.9 deg steppers 
position_min: 0
homing_positive_dir: true
homing_retract_dist: 0
homing_speed: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 188
position_max: 188

[tmc2209 stepper_y]
driver_TBL: 2
driver_TOFF: 1
driver_HSTRT: 1
driver_HEND: 0
uart_pin: micro:gpio9
uart_address: 0
run_current: 0.9
hold_current: 0.3
stealthchop_threshold: 0
#interpolate: true
diag_pin: micro:gpio13
driver_SGTHRS: 254

[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
tuning_goal: performance


[stepper_x]
step_pin: micro:gpio1
dir_pin: !micro:gpio0
enable_pin: !micro:gpio2
rotation_distance: 32
microsteps: 32
full_steps_per_rotation:200 #400 for 0.9 deg steppers 
position_min: 0
homing_positive_dir: true
homing_retract_dist: 0
homing_speed: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 174
position_max: 174

[tmc2209 stepper_x]
driver_TBL: 1
driver_TOFF: 7
driver_HSTRT: 7
driver_HEND: 0
uart_pin: micro:gpio9
uart_address: 1
run_current: 0.9
hold_current: 0.3
stealthchop_threshold: 0
#interpolate: true
diag_pin: micro:gpio14
driver_SGTHRS: 254

[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1
tuning_goal: performance


##############
# Z Steppers #
##############

## Z0 Stepper - Front Left 
[stepper_z]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32
endstop_pin:  probe:z_virtual_endstop
position_max: 165
position_min: -7
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2208 stepper_z]
uart_pin: PA5
interpolate: true
run_current: 0.7
stealthchop_threshold: 99999999999

##	Z1 Stepper - Rear Left 
[stepper_z2]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2208 stepper_z2]
uart_pin: PC13
interpolate: true
run_current: 0.9
stealthchop_threshold: 99999999999

##	Z2 Stepper - Rear Right 
[stepper_z1]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2208 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.7
stealthchop_threshold: 99999999999

##	Z3 Stepper - Front Right 
[stepper_z3]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

#[tmc2208 stepper_z3]
#uart_pin: PA9
#interpolate: true
#run_current: 0.8



############
# Extruder #
############

[extruder]
step_pin: micro:gpio26
dir_pin: micro:gpio25
enable_pin: !micro:gpio27
microsteps: 32
rotation_distance: 5.599
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: micro:gpio20
sensor_type: Generic 3950
#sensor_pin: micro:gpio29
sensor_pin: micro:gpio29
control: pid
pid_kp: 18.499
pid_ki = 3.873
pid_kd = 1.395
min_temp: 0
max_temp: 300
full_steps_per_rotation: 200	# 400 for 0.9 degree
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040 # this can be calibrated later
smooth_time: 0.5
max_extrude_only_distance: 500.0
min_extrude_temp: 0
#*# pid_kp = 13.306
#*# pid_ki = 1.848
#*# pid_kd = 5.988



[tmc2209 extruder]
uart_pin: micro:gpio9
uart_address: 2
run_current: 0.7
hold_current: 0.2
interpolate: true
stealthchop_threshold: 0

[force_move]
enable_force_move: true
