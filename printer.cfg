[include mainsail.cfg]
[include mcu.cfg]
#[include adxl.cfg]
[include bed.cfg]
[include fan.cfg]
[include macros.cfg]
[include probe.cfg]
[include stepper.cfg]
[include temperature_sensor.cfg]
#[include KlipperScreen.conf]
#[include shake.cfg]

[printer]
kinematics: corexy
max_velocity: 1000  
max_accel: 11000 			#This can be adjusted after you run Input Shaper calibration
max_z_velocity: 30			
max_z_accel: 350
square_corner_velocity: 25

[input_shaper]
shaper_type_x: 2hump_ei
shaper_freq_x: 123
shaper_type_y: ei
shaper_freq_y: 90

[homing_override]
axes: z
set_position_z: 0
gcode:
    G90
    G28 X Y
    PROBE_PICKUP
    G0 X87 Y94 F10000
    G28 Z
    PROBE_DOCK
    G0 X87 Y94 F10000

[idle_timeout]
timeout: 6000

[exclude_object]



